<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>蓝鲸搜索</title>
    <link rel="stylesheet" href="start.css" />
  </head>
  <body>
    <div class="aura" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="start.html" aria-label="蓝鲸搜索">
        <img src="icons/mark64.png" alt="" width="30" height="30" />
      </a>

      <button
        id="gear"
        class="gear"
        type="button"
        aria-label="设置"
        aria-expanded="false"
        aria-controls="menu"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.1" />
          <path d="M19.1 14.6a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.11a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.11a1.7 1.7 0 0 0 1.56-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.11a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.88V9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.11a1.7 1.7 0 0 0-1.56 1.03z" />
        </svg>
      </button>
    </header>

    <div id="menu" class="menu" role="dialog" aria-label="设置">
      <div class="menu-head">
        <span class="menu-title">设置</span>
        <button id="menu-close" class="icon-btn" type="button" aria-label="关闭设置">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>

      <div class="group">
        <div class="row">
          <label for="opt-count">每页显示</label>
          <select id="opt-count" class="select"></select>
        </div>
        <div class="row">
          <span id="content-label">附带网页正文</span>
          <button id="opt-content" class="switch" type="button" role="switch" aria-checked="false" aria-labelledby="content-label">
            <span class="thumb"></span>
          </button>
        </div>
      </div>

      <div class="group">
        <div class="group-title">API KEY</div>
        <input id="opt-key" class="field" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false" aria-label="DeepSeek API Key" />
        <div class="row tight">
          <span id="key-status" class="note">仅保存在本机</span>
          <button id="save-key" class="mini primary" type="button">保存</button>
        </div>
      </div>

      <div class="group">
        <div class="row">
          <span class="note">本地缓存 <b id="cache-count">0</b> 条</span>
          <button id="clear-cache" class="mini" type="button">清空</button>
        </div>
      </div>

      <p class="fineprint">5 元 / 1000 次成功请求 · 每账号 5 QPS</p>
    </div>

    <main id="stage" class="stage" data-view="home">
      <div class="hero">
        <div class="clock" aria-hidden="true">
          <div id="clock-time" class="time">--:--</div>
          <div id="clock-date" class="date"></div>
        </div>

        <form id="finder" class="finder" role="search" autocomplete="off">
          <svg class="finder-icon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" />
            <path d="M16 16l4 4" />
          </svg>
          <input
            id="q"
            type="text"
            placeholder="搜索网页"
            spellcheck="false"
            aria-label="搜索网页"
            enterkeyhint="search"
          />
          <kbd class="kbd">Enter</kbd>
        </form>

        <p id="hint" class="hint" role="status" aria-live="polite"></p>
      </div>

      <section id="results" class="results" aria-live="polite" aria-label="搜索结果"></section>
    </main>

    <script src="start.js"></script>
  </body>
</html>
